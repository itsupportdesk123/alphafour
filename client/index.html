<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alphafour Infrastructure Pvt Ltd · Where Elevation Meets Elegance</title>
    <meta
      name="description"
      content="Ultra-luxury sea-facing residences, penthouses and villas by Alphafour Infrastructure Pvt Ltd: Italian marble, private lifts, a sky deck with an infinity pool and a 360° virtual tour."
    />
    <meta name="theme-color" content="#0B1630" />
    <link rel="icon" type="image/png" href="/assets/alphalogo-removebg-preview.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alphafour Infrastructure Pvt Ltd" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Alphafour Infrastructure Pvt Ltd · Where Elevation Meets Elegance" />
    <meta
      property="og:description"
      content=" Explore the tower in 3D and book a private viewing."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Alphafour Altitude tower on the Chennai skyline at golden hour" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <style>
      /* Company intro film (src/features/intro). These rules live here so the splash can paint before
         any bundle loads; the React overlay reuses .intro-media and .intro-spinner. */
      html[data-intro] {
        overflow: hidden;
        scrollbar-gutter: stable;
      }
      .intro-splash {
        display: none;
      }
      html[data-intro] .intro-splash {
        display: block;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100vw; /* also covers the scrollbar gutter kept while the page is locked */
        z-index: 210;
        background: #05070d url('/videos/alphafour-intro-poster.webp') center / cover no-repeat;
      }
      .intro-media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
      }
      .intro-spinner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 1.5px solid rgba(201, 162, 75, 0.25);
        border-top-color: #c9a24b;
        animation: intro-spin 0.9s linear infinite;
      }
      .intro-splash .intro-spinner {
        opacity: 0;
        animation: intro-spin 0.9s linear infinite, intro-appear 0.4s 0.8s forwards;
      }
      @keyframes intro-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes intro-appear {
        to {
          opacity: 1;
        }
      }
      /* Portrait screens: a wide centred band rather than a tight crop, so the logo and name stay whole. */
      @media (max-aspect-ratio: 4/5) {
        html[data-intro] .intro-splash {
          background-size: 160vw auto;
        }
        .intro-media {
          inset: auto;
          left: 50%;
          top: 50%;
          width: 160vw;
          height: 90vw;
          transform: translate(-50%, -50%);
          -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
          mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
        }
      }
      /* Super-ultrawide screens: show the whole frame, so the name under the logo isn't cropped. */
      @media (min-aspect-ratio: 12/5) {
        html[data-intro] .intro-splash {
          background-size: auto 100%;
        }
        .intro-media {
          inset: auto;
          left: 50%;
          top: 0;
          width: 177.78vh;
          height: 100vh;
          transform: translateX(-50%);
          -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
          mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
        }
      }
    </style>

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('aurelia:theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}

      // Company intro film: decided here, before the app loads, so its splash covers the first paint.
      // ?intro=1 forces it and ?intro=0 skips it. Otherwise VITE_INTRO_MODE decides: session (once per
      // browser tab, the default), always, once (first visit only) or off. It never autoplays for
      // reduced motion, Data Saver or automated browsers. The app reads window.__alphafourIntro.
      var intro = false;
      try {
        var mode = '%VITE_INTRO_MODE%';
        var param = new URLSearchParams(location.search).get('intro');
        if (param === '1' || param === '') {
          intro = true;
        } else if (param !== '0' && mode !== 'off') {
          var seenStore = mode === 'always' ? null : mode === 'once' ? localStorage : sessionStorage;
          var calm = matchMedia('(prefers-reduced-motion: reduce)').matches || Boolean(navigator.connection && navigator.connection.saveData);
          var bot = navigator.webdriver || /bot|crawl|spider|slurp|lighthouse|headless/i.test(navigator.userAgent);
          intro = !calm && !bot && !(seenStore && seenStore.getItem('alphafour:intro-seen'));
          if (intro && seenStore) seenStore.setItem('alphafour:intro-seen', '1');
        }
      } catch (e) {
        intro = false;
      }
      window.__alphafourIntro = intro;
      if (intro) {
        document.documentElement.setAttribute('data-intro', 'play');
        var film = document.createElement('link');
        film.rel = 'preload';
        film.as = 'image';
        film.href = '/videos/alphafour-intro-poster.webp';
        film.setAttribute('fetchpriority', 'high');
        document.head.appendChild(film);
      }

      // Home page: fetch the hero poster (the LCP image) in parallel with the JavaScript. Behind the
      // intro film it is needed only once the film ends, so it doesn't compete with the film.
      if (location.pathname === '/') {
        var poster = document.createElement('link');
        poster.rel = 'preload';
        poster.as = 'image';
        // Same rule as MOBILE_QUERY in src/features/hero/heroConfig.js.
        poster.href = matchMedia('(max-width: 767px), (pointer: coarse)').matches ? '/hero-frames/poster-mobile.webp' : '/hero-frames/poster.webp';
        poster.setAttribute('fetchpriority', intro ? 'low' : 'high');
        document.head.appendChild(poster);
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: Georgia, serif">
        Alphafour Infrastructure Pvt Ltd works best with JavaScript enabled. Call +91 94443 14567 to speak with our team.
      </p>
    </noscript>
    <div id="intro-splash" class="intro-splash" aria-hidden="true"><span class="intro-spinner"></span></div>
    <script>
      // Failsafe: if the app never takes over the splash (a script failed to load), uncover the page.
      setTimeout(function () {
        var splash = document.getElementById('intro-splash');
        if (splash) {
          splash.remove();
          document.documentElement.removeAttribute('data-intro');
        }
      }, 20000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
